<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Bienvenido a Footer 👟</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f9fafb;
        margin: 0;
        padding: 0;
        color: #333;
      }
      .container {
        max-width: 600px;
        background: white;
        margin: 30px auto;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .header {
        text-align: center;
        padding-bottom: 20px;
      }
      .header img {
        width: 80px;
      }
      h1 {
        color: #1a73e8;
        font-weight: 700;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
      }
      .btn {
        display: inline-block;
        background-color: #1a73e8;
        color: white !important;
        padding: 12px 25px;
        border-radius: 5px;
        text-decoration: none;
        font-weight: 600;
        margin-top: 20px;
      }
      .footer {
        font-size: 12px;
        color: #999;
        text-align: center;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="https://i.imgur.com/eo01YIz.png" alt="Footer Logo" />
        <h1>¡Bienvenido a Footer!</h1>
      </div>
      <p>Hola {{name}},</p>
      <p>
        Gracias por registrarte en <strong>Footer 👟</strong>. Estamos
        encantados de tenerte con nosotros.
      </p>
      <p>
        Explora nuestros productos y disfruta de las mejores zapatillas al mejor
        precio.
      </p>
      <a
        href="https://tu-web.com/login"
        class="btn"
        target="_blank"
        rel="noopener"
        >Iniciar sesión</a
      >
      <p class="footer">Si no te registraste en Footer, ignora este mensaje.</p>
    </div>
  </body>
</html>

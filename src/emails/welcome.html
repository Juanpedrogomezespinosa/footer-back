<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>¡Bienvenido a Footer!</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="https://footer-shop.vercel.app/favicon.ico"
    />
    <style>
      body {
        font-family: "Poppins", Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f9fafb;
      }
      .container {
        width: 90%;
        max-width: 600px;
        margin: 20px auto;
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: hidden;
        background: #ffffff;
      }
      .header {
        background-color: #111827;
        color: #ffffff;
        padding: 25px 30px;
        text-align: center;
      }
      .header svg {
        width: 40px;
        height: 40px;
        color: #ff5a1f;
        vertical-align: middle;
        margin-right: 12px;
      }
      .header h1 {
        display: inline-block;
        margin: 0;
        font-size: 28px;
        color: #ffffff;
        font-weight: 700;
        vertical-align: middle;
      }
      .content {
        padding: 30px;
      }
      .content h2 {
        color: #111827;
        margin-top: 0;
      }
      .content p {
        line-height: 1.6;
        color: #333;
        font-size: 16px;
        margin: 12px 0;
      }
      .button-container {
        text-align: center;
        margin-top: 25px;
      }
      .button {
        display: inline-block;
        padding: 12px 28px;
        background-color: #ff5a1f;
        color: #ffffff;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
      }
      .footer {
        font-size: 13px;
        color: #777;
        text-align: center;
        margin-top: 20px;
        padding: 20px 30px;
        background-color: #f9f9f9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <svg
          fill="currentColor"
          viewBox="0 0 48 48"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            clip-rule="evenodd"
            fill-rule="evenodd"
            d="M24 4H6V17.3333V30.6667H24V44H42V30.6667V17.3333H24V4Z"
          />
        </svg>
        <h1>Footer</h1>
      </div>
      <div class="content">
        <h2>¡Bienvenido!</h2>
        <p>Hola {{name}},</p>
        <p>
          Gracias por registrarte en <strong>Footer 👟</strong>. Estamos
          encantados de tenerte con nosotros.
        </p>
        <p>
          Explora nuestras colecciones y disfruta de las mejores marcas al mejor
          precio.
        </p>

        <div class="button-container">
          <a
            href="https://footer-shop.vercel.app/login"
            class="button"
            target="_blank"
            rel="noopener"
            style="color: #ffffff"
            >Iniciar sesión</a
          >
        </div>
      </div>
      <div class="footer">
        <p>Si no te registraste en Footer, puedes ignorar este mensaje.</p>
      </div>
    </div>
  </body>
</html>

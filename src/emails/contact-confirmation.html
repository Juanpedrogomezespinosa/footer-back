<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirmación de Contacto</title>
    <style>
      body {
        font-family: "Poppins", Arial, sans-serif;
        margin: 0;
        padding: 0;
      }
      .container {
        width: 90%;
        max-width: 600px;
        margin: 20px auto;
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: hidden;
      }
      .header {
        background-color: #111827;
        color: #ffffff;
        padding: 20px;
        text-align: center;
      }
      .header h1 {
        margin: 0;
      }
      .content {
        padding: 30px;
      }
      .content p {
        line-height: 1.6;
        color: #333;
      }
      .footer {
        background-color: #f9f9f9;
        color: #777;
        padding: 20px;
        text-align: center;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Footer 👟</h1>
      </div>
      <div class="content">
        <p>Hola, {{name}},</p>
        <p>
          ¡Hemos recibido tu mensaje! Gracias por ponerte en contacto con
          nosotros.
        </p>
        <p>Nuestro equipo lo revisará y te responderá lo antes posible.</p>
        <br />
        <p>Atentamente,</p>
        <p>El equipo de Footer</p>
      </div>
      <div class="footer">
        <p>&copy; 2025 Footer. Todos los derechos reservados.</p>
      </div>
    </div>
  </body>
</html>
